{% extends "base.html" %}

{% block title %}Update Payment | HoMS{% endblock %}

{% block content %}
<div class="card card-soft mx-auto" style="max-width: 640px;">
    <div class="card-body p-4">
        <h4 class="mb-1">Update Payment</h4>
        <p class="text-secondary">Student: {{ payment.user.username }}</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Amount</label>
                {{ form.amount }}
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                {{ form.status }}
            </div>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</div>
{% endblock %}
