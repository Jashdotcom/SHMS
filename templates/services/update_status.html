{% extends "base.html" %}

{% block title %}Update Service Status | HoMS{% endblock %}

{% block content %}
<div class="card card-soft mx-auto" style="max-width: 640px;">
    <div class="card-body p-4">
        <h4 class="mb-1">Update Service Status</h4>
        <p class="text-secondary mb-3">Request by {{ service.user.username }} ({{ service.get_request_type_display }})</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option value="requested" {% if service.status == "requested" %}selected{% endif %}>Requested</option>
                    <option value="in_progress" {% if service.status == "in_progress" %}selected{% endif %}>In Progress</option>
                    <option value="completed" {% if service.status == "completed" %}selected{% endif %}>Completed</option>
                </select>
            </div>
            <button type="submit" class="btn btn-success mt-2">Update Status</button>
            <a href="{% url 'services:list' %}" class="btn btn-outline-secondary mt-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
