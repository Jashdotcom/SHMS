{% extends "base.html" %}

{% block title %}Request Service | HoMS{% endblock %}

{% block content %}
<div class="card card-soft mx-auto" style="max-width: 760px;">
    <div class="card-body p-4">
        <h4 class="mb-1">Request Service</h4>
        <p class="text-secondary">Request cleaning or maintenance support.</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Service Type</label>
                {{ form.request_type }}
            </div>
            <div class="mb-3">
                <label class="form-label">Details</label>
                {{ form.details }}
            </div>
            <button type="submit" class="btn btn-primary">Submit Request</button>
        </form>
    </div>
</div>
{% endblock %}
